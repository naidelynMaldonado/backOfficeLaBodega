<div class="p-6 bg-[#ffffff] my-4">
  <h2 class="text-xl font-semibold text-gray-700 mb-4">Crear Zona</h2>
  <form (ngSubmit)="submitZone()">
    <div class="mb-4">
      <label for="providerId" class="block text-sm font-medium text-gray-700">Proveedor de Envíos</label>
      <select id="providerId" [(ngModel)]="selectedProviderId" name="providerId" (change)="onProviderChange()" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
        <option value="" disabled>Seleccione un proveedor</option>
        <option *ngFor="let provider of providers; let i = index" [value]="provider.codproveedor" [hidden]="i === 0">{{ provider.nombreproveedor }}</option>
      </select>
    </div>
    <div class="mb-4">
      <div id="modalMap" class="w-full h-64 border border-gray-300 rounded"></div>
    </div>
    <div class="flex justify-end gap-4">
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Guardar</button>
    </div>
  </form>
</div>
