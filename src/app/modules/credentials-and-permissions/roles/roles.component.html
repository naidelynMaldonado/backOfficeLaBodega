<div class="flex items-center justify-between p-4">
  <h2 class="text-[28px] font-semibold text-indigo-600">Gestión de Roles</h2>
  <button 
  class="flex items-center gap-2 pr-4 pl-2 py-2 bg-[#002485] text-[#ffffff] font-medium rounded-md hover:bg-indigo-700 transition-colors"
  (click)="onNew()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
    </svg>
    Nuevo Rol
  </button>
</div>
<div class="p-6 mx-auto">
  <div class="bg-[#ffffff] rounded-lg bg shadow-md overflow-hidden">
    <!-- Header -->

    <!-- Table -->
    <div class="overflow-x-auto max-h-96 overflow-scroll">
      <table class="min-w-full divide-y divide-gray-200 ">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Nombre del Rol
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Estado
            </th>
            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
              
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let r of roles" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap font-medium">
              <span class="px-2 py-1 text-sm bg-blue-100 text-blue-800 rounded-full">
                {{ r.nombre }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="role-badge" [ngClass]="{ 'role-inactive': r.estado === 'inactivo', 'role-active': r.estado === 'activo' }">
                {{ r.estado | titlecase }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <div class="flex justify-center">
                <button mat-icon-button (click)="selectRole(r)" [matMenuTriggerFor]="rowMenu" aria-label="Acciones">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M6 10a2 2 0 114 0 2 2 0 11-4 0zm4 0a2 2 0 114 0 2 2 0 11-4 0zM2 10a2 2 0 114 0 2 2 0 11-4 0z" />
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Menú compartido para acciones por fila -->
<mat-menu #rowMenu="matMenu">
  <button mat-menu-item (click)="onEditSelected()">
    <mat-icon>edit</mat-icon>
    <span>Editar</span>
  </button>
  <button mat-menu-item (click)="onToggleActiveSelected()">
    <mat-icon>block</mat-icon>
    <span>{{ selectedRole?.estado === 'activo' ? 'Desactivar' : 'Activar' }}</span>
  </button>
</mat-menu>

<!-- Edit / Create role drawer -->
<app-edit-role [(open)]="editDrawerOpen" [title]="editDrawerTitle" [role]="selectedRole" (saved)="onSaved($event)"></app-edit-role>
