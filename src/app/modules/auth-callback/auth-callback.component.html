<!-- Fondo con imagen + overlay -->
<div class="relative w-full min-h-screen overflow-hidden bg-neutral-50">
  <img
    src="./assets/img/bg-login.png"
    alt="Fondo de la bodega"
    class="absolute inset-0 w-full h-full object-cover opacity-40 sm:opacity-100"
  />
  <div class="absolute inset-0 bg-gradient-to-b from-neutral-900/20 to-transparent"></div>

  <!-- Contenedor centrado -->
  <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
    <section
      role="dialog"
      aria-modal="true"
      aria-labelledby="authLoadingTitle"
      aria-describedby="authLoadingDesc"
      class="w-full max-w-[640px] rounded-2xl bg-white/90 backdrop-blur-md border border-neutral-200 shadow-lg p-6 sm:p-8 mx-4"
    >
      <!-- Encabezado con logo y título -->
      <div class="flex items-center gap-3 border-b border-neutral-100 pb-4 mb-6">
        <img
          src="./assets/brand/iconLaBodega.png"
          alt="Logo LaBodega"
          class="w-[90px] h-[40px] object-contain sm:w-[105px] sm:h-[48px]"
        />
        <p class="m-0 text-md text-primary-800 font-semibold">Backoffice</p>
      </div>

      <!-- Cuerpo: spinner + textos -->
      <div class="flex flex-col items-center text-center gap-4 px-2">
        <div class="w-28 h-28 flex items-center justify-center">
          <app-loader></app-loader>
        </div>

        <h1 id="authLoadingTitle" class="m-0 text-neutral-900 text-h-sm">
          Conectando con Microsoft 365…
        </h1>
        <p id="authLoadingDesc" class="m-0 text-neutral-600 text-b-sm max-w-[44rem]">
          Estamos iniciando tu sesión. No cierres ni recargues esta ventana.
        </p>

        <div class="flex items-center gap-2 text-b-xs text-neutral-500 mt-2" aria-live="polite">
          <span class="inline-flex h-2 w-2 rounded-full bg-primary-800 animate-pulse"></span>
          <span>Redirigiendo de forma segura…</span>
        </div>
      </div>

      <!-- Indicador sutil de progreso -->
      <div class="mt-6">
        <div class="h-2 w-full bg-neutral-100 rounded-full overflow-hidden">
          <div class="h-full w-2/3 bg-primary-800 animate-pulse rounded-full"></div>
        </div>
      </div>

      <!-- Acción de escape (solo UI) -->
      <div class="mt-6 text-center">
        <p class="text-b-xs text-neutral-500">
          Si no ocurre nada en unos segundos,
          <a routerLink="/login" class="text-primary-800 underline underline-offset-4 hover:no-underline">
            regresa al inicio
          </a>.
        </p>
      </div>
    </section>
  </div>
</div>
